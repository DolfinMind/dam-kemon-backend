# Production profile — activated with SPRING_PROFILES_ACTIVE=production
# Overlays application.yml. Anything not declared here inherits dev defaults.

spring:
  data:
    mongodb:
      auto-index-creation: true
  cache:
    caffeine:
      # Smaller cache on the 1 GB box — frees heap for indexing (was 5000)
      spec: maximumSize=1500,expireAfterWrite=300s,recordStats

# 1 GB-SAFE mode (prod box is 1 vCPU / 1 GB). Shops index sequentially with a tiny
# URL pool; the dedup index warms from an id+name projection; ~66 Shopify/WooCommerce
# shops are pulled via cheap bulk JSON (JsonCatalogHarvester) instead of page scraping.
# Chromium stays OFF (too heavy here). A GENTLE 24/7 catch-up runs every 6h toward the
# 30k target and self-stops. Re-enable Chromium + high parallelism after resizing to >= 2 GB.
indexer:
  global-parallelism: 4
  per-host-parallelism: 2
  max-products-per-shop: 1500
  max-urls-per-shop: 1500
  per-extract-timeout-ms: 30000
  scheduled: true
  cron: 0 0 3 * * *
  user-agent: "Mozilla/5.0 (compatible; DamKemonBot/1.0; +https://damkemon.com/bot)"
  # Catch-up driver: keep running full passes until we hit the product target,
  # then idle. Fires ~1 min after deploy, then every 2h after the previous pass
  # completes. Backs off automatically if the catalog plateaus (shops drained).
  catchup-enabled: true              # gentle 24/7 driver — cheap JSON harvest makes this 1 GB-safe
  target-products: 30000
  catchup-interval-ms: 10800000      # 3h between passes — faster shop-set rotation (box is idle ~95% of the time)
  catchup-initial-delay-ms: 600000   # first pass ~10 min after boot (not a tight loop if a run is heavy)
  catchup-min-progress: 50           # < this many new products/pass = "no progress"
  catchup-max-stagnant: 3            # flat cycles before backing off to probe-only
  catchup-auto-approve: true         # promote discovered shops automatically — was false, so discovery
                                     # found candidates that NEVER got crawled; the catch-up kept
                                     # re-scraping the same drained shop set and the count plateaued.
  catchup-approve-per-cycle: 25      # max pending shops approved per pass

# Marketplace harvesters were pinned at ~500/shop — daraz & chaldal are the two
# biggest single sources, so those caps were a hard ceiling on the catalog.
# These are JSON harvests (low memory), safe to raise on the 1 GB box; the global
# indexer.max-products-per-shop (1500) is still the real ceiling.
daraz:
  max-products: 1500
  max-pages-per-query: 2             # was 1 — one page ≈ 40 items; two doubles reach per seed
  max-per-query: 40                  # was 24
chaldal:
  max-products: 1500
  max-pages-per-query: 3             # was 2
  max-per-query: 30                  # was 16
json-harvest:
  max-pages: 30                      # was 15 — let big Shopify/Woo catalogs reach the 1500 cap

browser:
  enabled: true        # ON: 2 GB swap (added 2026-06-04) is the OOM safety net. Unlocks SPA shops
                       # (Pickaboo/Aarong) via the render-once ApiSniffer. Revert to false if the box thrashes.

price-history:
  enabled: true
  snapshot-cron: 0 0 4 * * *

logging:
  level:
    root: WARN
    com.damKemon: INFO
    org.springframework.web: WARN
    org.mongodb.driver: ERROR

# Tighter actuator exposure in prod — health probes only, no /metrics surface
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never  # don't leak Mongo connection details to anonymous health checks
