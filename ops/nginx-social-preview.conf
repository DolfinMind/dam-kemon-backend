# Social link previews for /product/* — route social-crawler user-agents to
# the backend's SharePreviewController (same path, same pattern as the
# existing /sitemap.xml and /robots.txt rules); browsers still get the SPA.
#
# Install on the droplet:
#   1. The `map` block goes at http{} level (e.g. /etc/nginx/conf.d/social-preview-map.conf,
#      or above the server block if everything lives in one file).
#   2. The `location /product/` block goes INSIDE the existing damkemon.com
#      server block, alongside the /api location. If a location already
#      handles /product/ or the SPA fallback differs from `try_files $uri
#      /index.html`, merge accordingly.
#   3. nginx -t && systemctl reload nginx
#
# Verify (should return HTML with og:title = product name):
#   curl -A "facebookexternalhit/1.1" https://damkemon.com/product/<some-slug> | grep og:
#   curl https://damkemon.com/product/<some-slug> | grep og:   # still the SPA head
# Then re-scrape a link at https://developers.facebook.com/tools/debug/

map $http_user_agent $social_crawler {
    default 0;
    ~*facebookexternalhit 1;   # Facebook + Messenger
    ~*facebot              1;
    ~*whatsapp             1;
    ~*twitterbot           1;
    ~*telegrambot          1;
}

# --- inside the damkemon.com server block ---
location /product/ {
    # proxy_pass without a URI part is the one form nginx allows inside if{};
    # the backend serves GET /product/{idOrSlug} at the same path.
    if ($social_crawler) {
        proxy_pass http://127.0.0.1:8080;
    }
    try_files $uri /index.html;   # everyone else: SPA as before
}
