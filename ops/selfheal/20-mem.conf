# systemd drop-in for damkemon-prod-app.service — memory hygiene for the API.
#
# The API no longer crawls (that moved to damkemon-prod-worker.service), so its
# footprint is bounded by serving + caches. These two settings make any residual
# heap exhaustion RECOVER cleanly instead of GC-thrashing into a hung-but-alive
# JVM (which the liveness watchdog would otherwise have to catch minutes later):
#   * ExitOnOutOfMemoryError — a heap OOM exits the process, so Restart=always
#     brings it back in seconds rather than thrashing.
#   * MaxRAMPercentage=70 — bound the heap to the box so native/Chromium-free
#     headroom remains for the OS and Mongo driver.
[Service]
Environment="JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=70"
