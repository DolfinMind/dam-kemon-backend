# systemd drop-in for damkemon-prod-app.service.
# Auto-restart the API whenever the process exits unexpectedly — a crash or,
# most often here, an OOM-kill triggered by the nightly Playwright crawler.
# Without this the site stays "Backend unreachable" until a manual redeploy.
# An explicit `systemctl stop` is still respected (no restart).
[Service]
Restart=always
RestartSec=10
