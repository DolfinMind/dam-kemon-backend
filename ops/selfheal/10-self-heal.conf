# systemd drop-in for damkemon-prod-app.service.
# The base unit ships Restart=on-failure, which already restarts on a clean
# OOM-kill — yet the site still went down until a manual redeploy. That points
# at either a hung-but-alive JVM (no exit, so Restart never fires — the
# liveness watchdog covers that) or systemd giving up after several fast
# crashes on a memory-starved box. This drop-in closes the second gap:
#   * Restart=always   — recover even on a clean exit, not just failures.
#   * StartLimitIntervalSec=0 — never stop retrying; a daily crawl won't loop
#     anyway (the crash isn't re-triggered until the next cron).
# An explicit `systemctl stop` is still respected (no restart).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
