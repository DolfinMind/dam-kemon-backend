name: Deploy to Production

on:
  push:
    branches:
      - deployment-prod

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle (clean build)
        run: |
          ./gradlew clean bootJar
          # Remove the plain JAR to avoid confusion
          rm -f build/libs/*-plain.jar

      - name: Copy JAR to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/${{ vars.SERVER_USER }}/server/"
          strip_components: 2

      - name: Deploy and restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Restart the service to load the new JAR
            sudo systemctl restart damkemon-prod-app.service
            sleep 5

            # Check status
            sudo systemctl status damkemon-prod-app.service

      # Self-heal: keep the API up between deploys. Restart=always covers a
      # crash/OOM-kill (the nightly crawler is the usual culprit); the watchdog
      # timer covers a hung-but-alive process. Non-fatal so it never blocks a
      # deploy.
      - name: Copy self-heal ops files
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "ops/selfheal/*"
          target: "/home/${{ vars.SERVER_USER }}/selfheal/"
          strip_components: 2

      - name: Apply self-heal (Restart=always + liveness watchdog)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # install.sh needs root (writes /etc/systemd). Auto-apply only when
            # the deploy user has passwordless sudo; otherwise stage the files
            # and print the one-time activation command instead of failing.
            if sudo -n true 2>/dev/null; then
              bash /home/${{ vars.SERVER_USER }}/selfheal/install.sh
            else
              echo "Self-heal staged at ~/selfheal. The deploy user lacks passwordless sudo,"
              echo "so activate it once by hand (persists across deploys & restarts):"
              echo "    sudo bash ~/selfheal/install.sh"
              echo "Or add a sudoers NOPASSWD rule for systemctl+install to automate this step."
            fi
            echo "current restart policy:"
            systemctl show damkemon-prod-app.service -p Restart -p RestartSec 2>/dev/null || true

      - name: Show recent application logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== Last 50 lines of application logs ==="
            sudo journalctl -u damkemon-prod-app.service -n 50 --no-pager

            echo ""
            echo "=== Checking for errors in last 100 lines ==="
            sudo journalctl -u damkemon-prod-app.service -n 100 --no-pager | grep -i "error\|exception\|failed" || echo "No errors found"
