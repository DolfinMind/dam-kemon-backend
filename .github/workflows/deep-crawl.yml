name: deep-crawl
# FREE crawler — runs a deep crawl pass on GitHub's hosted runners (no proxy,
# no paid compute). Each run gets a fresh runner IP. It crawls every active
# shop with a high per-shop cap (more products per seller) and merges cross-shop
# SKUs (more sellers per product), writing to the prod Atlas DB.
#
# SETUP (one time): repo Settings → Secrets and variables → Actions → New secret
#   MONGODB_URI = <your Atlas connection string>
#
# Run it: the Actions tab → "deep-crawl" → "Run workflow" (or it runs on the cron).
#
# Free minutes: private repos get 2000 CI min/month. The daily cron below uses
# ~55 min/run (~1700/mo). Want it deeper/more often without burning minutes?
# Register a SELF-HOSTED runner (your own box / the prod server) — it's unlimited
# and free; just change `runs-on:` to your runner's label.

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Crawl time budget (minutes)'
        default: '120'
      per_shop:
        description: 'Max products indexed per shop'
        default: '5000'
      heap:
        description: 'JVM heap (e.g. 5g)'
        default: '5g'
  schedule:
    - cron: '0 1 * * *'        # daily 01:00 UTC — bounded to stay under free tier

concurrency:
  group: deep-crawl            # never overlap two crawls
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*') }}
      - name: Deep crawl pass
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || '55' }}
          PER_SHOP:    ${{ github.event.inputs.per_shop    || '5000' }}
          HEAP:        ${{ github.event.inputs.heap        || '5g' }}
          BROWSER_ENABLED: 'false'
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Set the MONGODB_URI repo secret first (see this file's header)."; exit 1
          fi
          chmod +x ci-crawl.sh
          ./ci-crawl.sh
