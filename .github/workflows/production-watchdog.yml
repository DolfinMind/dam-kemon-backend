name: Production API Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-api-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe production API
        id: probe
        env:
          HEALTH_URL: https://damkemon.com/api/auth/config
        run: |
          healthy=false
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 15 "$HEALTH_URL" >/dev/null; then
              healthy=true
              break
            fi
            sleep 10
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"

      - name: Restart unresponsive API
        if: steps.probe.outputs.healthy == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart damkemon-prod-app.service
            for attempt in 1 2 3 4 5 6; do
              sleep 10
              if curl --fail --silent --show-error --max-time 10 \
                http://127.0.0.1:8080/actuator/health/liveness >/dev/null; then
                exit 0
              fi
            done
            exit 1
